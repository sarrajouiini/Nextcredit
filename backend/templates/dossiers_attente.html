<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextCredit — Dossiers en attente</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152247;--navy-light:#1e3060;
  --sky:#89B4E8;--sky-light:#c4d9f5;--sky-dim:#e8f1fb;
  --bg:#f4f6fb;--card:#ffffff;--line:#eaeef6;
  --g500:#6b7488;--g400:#9aa1b3;
  --ok:#3ec98b;--ok-soft:#e6f9ef;
  --warn:#f5a623;--warn-soft:#fef3df;
  --danger:#ef4b4b;--danger-soft:#fde9e9;
  --r-card:18px;--r-md:12px;--r-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--navy);height:100vh;display:flex;flex-direction:column;overflow:hidden;}


/* ── LAYOUT ── */
.shell{flex:1;display:flex;overflow:hidden;}

/* ── LEFT PANEL ── */
.left-panel{width:480px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#fff;}
.lp-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.lp-head h2{font-family:'Syne';font-size:14px;font-weight:700;color:var(--navy);flex:1;}
.lp-refresh{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--g500);cursor:pointer;}
.lp-refresh:hover{border-color:var(--sky);color:var(--navy);}
.lp-body{flex:1;overflow-y:auto;}
.doss-table{width:100%;border-collapse:collapse;}
.doss-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--g400);padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;text-align:left;}
.doss-table td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
.doss-table tr:hover td{background:var(--sky-dim);cursor:pointer;}
.doss-table tr.selected td{background:#e8f1fb;border-left:3px solid var(--sky);}
.score-chip{display:inline-block;padding:3px 10px;border-radius:20px;font-family:'Syne';font-size:12px;font-weight:700;}
.nota-chip{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;}
.dec-chip{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.dec-chip.APPROUVE{background:var(--ok-soft);color:var(--ok);}
.dec-chip.REFUSE{background:var(--danger-soft);color:var(--danger);}
.dec-chip.REVUE_MANUELLE{background:var(--warn-soft);color:var(--warn);}
.lp-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--g400);background:var(--bg);}

/* ── RIGHT PANEL ── */
.right-panel{flex:1;overflow-y:auto;padding:24px;}
.rp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;color:var(--g400);}
.rp-empty svg{opacity:.2;}
.rp-empty p{font-size:13px;text-align:center;}

/* ── DETAIL ── */
.det-topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.det-id{font-family:'Syne';font-size:20px;font-weight:800;color:var(--navy);}
.det-date{font-size:12px;color:var(--g400);margin-left:auto;}
.det-grid{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start;}

/* Scoring card */
.scoring-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.gauge-wrap{position:relative;width:220px;height:128px;}
.gauge-wrap svg{width:220px;height:220px;position:absolute;top:0;left:0;}
.gauge-center{position:absolute;bottom:12px;left:0;right:0;display:flex;flex-direction:column;align-items:center;}
.gauge-num{font-family:'Syne';font-size:36px;font-weight:800;line-height:1;letter-spacing:-.5px;}
.gauge-denom{font-size:10px;color:var(--g400);margin-top:2px;}
.score-meta{display:flex;gap:28px;justify-content:center;}
.sm-item{text-align:center;}
.sm-val{font-family:'Syne';font-size:14px;font-weight:700;}
.sm-lbl{font-size:10px;color:var(--g400);margin-top:1px;}
.dec-band{display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:var(--r-md);width:100%;}
.dec-band.APPROUVE{background:var(--ok-soft);}
.dec-band.REFUSE{background:var(--danger-soft);}
.dec-band.REVUE_MANUELLE{background:var(--warn-soft);}
.dec-band .dec-lbl{font-family:'Syne';font-size:14px;font-weight:700;}
.dec-band.APPROUVE .dec-lbl{color:var(--ok);}
.dec-band.REFUSE .dec-lbl{color:var(--danger);}
.dec-band.REVUE_MANUELLE .dec-lbl{color:var(--warn);}

/* Section title */
.sec-title{font-family:'Syne';font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--sky);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--line);}

/* Fields display */
.fields-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;margin-bottom:18px;}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;}
.fields-grid.c3{grid-template-columns:1fr 1fr 1fr;}
.fld{display:flex;flex-direction:column;gap:3px;}
.fld-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--g400);}
.fld-val{font-size:13.5px;font-weight:600;color:var(--navy);}
.fld-val.highlight{color:var(--sky);font-family:'Syne';}

/* Motifs */
.motifs-card{background:var(--warn-soft);border:1px solid #fce0b0;border-radius:var(--r-card);padding:18px;margin-bottom:18px;}
.motifs-title{font-family:'Syne';font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}
.motif-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:13px;}
.motif-dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex-shrink:0;margin-top:5px;}

/* Agent decision */
.agent-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;margin-bottom:18px;}
.agent-title{font-family:'Syne';font-size:13px;font-weight:700;color:var(--navy);margin-bottom:14px;}
.agent-btns{display:flex;gap:12px;margin-bottom:14px;}
.btn-approve{flex:1;height:46px;background:var(--ok);color:#fff;border:none;border-radius:var(--r-md);font-family:'Syne';font-size:14px;font-weight:700;cursor:pointer;transition:.15s;}
.btn-approve:hover{filter:brightness(1.08);}
.btn-approve:disabled{opacity:.4;cursor:not-allowed;}
.btn-reject{flex:1;height:46px;background:var(--danger);color:#fff;border:none;border-radius:var(--r-md);font-family:'Syne';font-size:14px;font-weight:700;cursor:pointer;transition:.15s;}
.btn-reject:hover{filter:brightness(1.08);}
.btn-reject:disabled{opacity:.4;cursor:not-allowed;}
.motif-select{width:100%;height:42px;padding:0 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-family:'DM Sans';font-size:13px;color:var(--navy);background:var(--bg);display:none;}
.motif-select.show{display:block;}
.btn-confirm{width:100%;height:44px;background:var(--navy);color:#fff;border:none;border-radius:var(--r-md);font-family:'Syne';font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;display:none;}
.btn-confirm.show{display:block;}
.decision-done{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:var(--r-md);font-family:'Syne';font-size:14px;font-weight:700;display:none;}
.decision-done.ok{background:var(--ok-soft);color:var(--ok);}
.decision-done.bad{background:var(--danger-soft);color:var(--danger);}

.loading-msg{display:flex;align-items:center;justify-content:center;height:200px;gap:12px;color:var(--g400);font-size:13px;}
.spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--sky);border-radius:50%;animation:rot .6s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
</style>
</head>
<body>


<div class="shell">

  <!-- ── LISTE ── -->
  <div class="left-panel">
    <div class="lp-head">
      <h2>Dossiers EN_ATTENTE <span id="badge_count" style="background:var(--sky-dim);color:var(--sky);font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px;"></span></h2>
      <button class="lp-refresh" onclick="loadDossiers()">↻ Actualiser</button>
    </div>
    <div class="lp-body">
      <table class="doss-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Score</th>
            <th>Notation</th>
            <th>Décision modèle</th>
          </tr>
        </thead>
        <tbody id="doss_tbody">
          <tr><td colspan="5" style="text-align:center;padding:40px;color:var(--g400);">Chargement…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="lp-foot" id="lp_foot">—</div>
  </div>

  <!-- ── DÉTAIL ── -->
  <div class="right-panel" id="right_panel">
    <div class="rp-empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>
      <p>Sélectionnez un dossier dans la liste<br>pour afficher son détail et prendre une décision</p>
    </div>
  </div>

</div>

<script>
const BASE = 'http://127.0.0.1:5000/api';

function getToken(){
  return new URLSearchParams(window.location.search).get('token')
      || localStorage.getItem('nc_access_token')
      || localStorage.getItem('nc_jwt')
      || localStorage.getItem('access_token')
      || localStorage.getItem('token')
      || '';
}
function ah(extra){
  const t = getToken();
  return Object.assign({'Content-Type':'application/json'}, t ? {'Authorization':'Bearer '+t} : {}, extra||{});
}

/* ── Session expirée ── */
function showSessionExpired(){
  if(document.getElementById('_so')) return;
  const o=document.createElement('div'); o.id='_so';
  o.style.cssText='position:fixed;inset:0;background:rgba(21,34,71,.85);z-index:9999;display:flex;align-items:center;justify-content:center;';
  o.innerHTML='<div style="background:#fff;border-radius:18px;padding:40px 48px;text-align:center;max-width:340px;"><div style="font-size:36px;margin-bottom:12px;">⏱️</div><h2 style="font-family:Syne,sans-serif;color:#152247;margin-bottom:8px;">Session expirée</h2><p style="color:#6b7a96;font-size:13px;margin-bottom:20px;">Veuillez vous reconnecter.</p><button onclick="location.reload()" style="background:#152247;color:#fff;border:none;border-radius:12px;padding:12px 32px;font-family:Syne,sans-serif;font-weight:700;font-size:14px;cursor:pointer;width:100%;">🔄 Recharger</button></div>';
  document.body.appendChild(o);
}
async function apiFetch(url, options={}){
  options.headers = options.headers || ah();
  const r = await fetch(url, options);
  if(r.status===401){ showSessionExpired(); throw new Error('401'); }
  return r;
}

/* ── Score color ── */
function scoreColor(s){ return s>=800?'#3ec98b':s>=650?'#8fe0b6':s>=500?'#89B4E8':s>=350?'#f5a623':'#ef4b4b'; }
const NOTA_COL = {AAA:'#3ec98b',AA:'#5ed79b',A:'#8fe0b6',BBB:'#89B4E8',BB:'#f5a623',B:'#f0832a',CCC:'#ef4b4b'};

/* ── LOAD LIST ── */
let allDossiers = [];
let selectedId  = null;

async function loadDossiers(){
  try{
    const r = await apiFetch(`${BASE}/octroi/dossiers-en-attente?limit=100`);
    const j = await r.json();
    allDossiers = j.success ? (j.data.dossiers || []) : [];
    renderTable();
  }catch(e){ console.error(e); }
}

function formatDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function renderTable(){
  const tbody = document.getElementById('doss_tbody');
  document.getElementById('badge_count').textContent = allDossiers.length;
  document.getElementById('lp_foot').textContent = `${allDossiers.length} dossier(s) en attente de validation`;
  if(!allDossiers.length){
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--g400);">Aucun dossier en attente</td></tr>';
    return;
  }
  tbody.innerHTML = allDossiers.map((d,i)=>{
    const c  = scoreColor(d.Score||0);
    const nc = NOTA_COL[d.Notation]||'#888';
    const dc = d.DecisionModele||'—';
    return `<tr id="drow_${i}" onclick="selectDossier(${i})">
      <td style="color:var(--g400);font-size:11px">${i+1}</td>
      <td style="font-size:12px">${formatDate(d.DateDemande)}</td>
      <td><span class="score-chip" style="background:${c}1f;color:${c}">${d.Score??'—'}</span></td>
      <td><span class="nota-chip" style="background:${nc}1f;color:${nc}">${d.Notation||'—'}</span></td>
      <td><span class="dec-chip ${dc}">${dc}</span></td>
    </tr>`;
  }).join('');
}

/* ── SELECT DOSSIER ── */
function selectDossier(idx){
  document.querySelectorAll('.doss-table tbody tr').forEach(r=>r.classList.remove('selected'));
  document.getElementById('drow_'+idx)?.classList.add('selected');
  const d = allDossiers[idx];
  selectedId = d.Id;
  renderDetail(d);
}

function renderDetail(d){
  const panel = document.getElementById('right_panel');
  const dc = d.DecisionModele||'—';
  const sc = d.Score||0;
  const color = scoreColor(sc);
  const nc  = NOTA_COL[d.Notation]||'#888';
  const pd  = d.ProbabiliteDefaut != null ? (d.ProbabiliteDefaut*100).toFixed(2) : '—';
  const client = d.DonneesClient || {};
  const motifs = Array.isArray(d.MotifsModele) ? d.MotifsModele : [];

  // Gauge ticks
  const pct = Math.max(0,Math.min(1,sc/1000));
  const CX=110,CY=110,R=85,startA=Math.PI,endA=2*Math.PI;
  let ticks='';
  for(let i=0;i<=28;i++){
    const tp=i/28, a=startA+(endA-startA)*tp;
    const x1=CX+R*Math.cos(a), y1=CY+R*Math.sin(a);
    const x2=CX+(R-13)*Math.cos(a), y2=CY+(R-13)*Math.sin(a);
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="3" stroke-linecap="round" opacity="${tp<=pct?'1':'0.1'}"/>`;
  }

  const fld = (lbl, val, hl=false) =>
    `<div class="fld"><div class="fld-lbl">${lbl}</div><div class="fld-val${hl?' highlight':''}">${val||'—'}</div></div>`;

  const bool = v => v==1||v===true||v==='true'||v==='1' ? 'Oui' : 'Non';

  panel.innerHTML = `
  <div class="det-topbar">
    <div class="det-id">Dossier #${d.Id}</div>
    <span class="dec-chip ${dc}">${dc}</span>
    <div class="det-date">${formatDate(d.DateDemande)}</div>
  </div>

  <div class="det-grid">

    <!-- Colonne gauche -->
    <div>
      <!-- Infos personnelles -->
      <div class="fields-card">
        <div class="sec-title">Informations personnelles</div>
        <div class="fields-grid c3">
          ${fld('CIN', client.CIN, true)}
          ${fld('Genre', client.Genre)}
          ${fld('Âge', client.Age ? client.Age+' ans' : null)}
          ${fld('Situation familiale', client.Situation_Familiale)}
          ${fld('Nb enfants', client.Nb_Enfants)}
          ${fld('Membres famille', client.Nb_Membres_Famille)}
        </div>
      </div>

      <!-- Situation professionnelle -->
      <div class="fields-card">
        <div class="sec-title">Situation professionnelle & revenus</div>
        <div class="fields-grid">
          ${fld('Type de revenu', client.Type_Revenu)}
          ${fld('Type de contrat', client.Type_Contrat)}
          ${fld('Niveau d\'éducation', client.Niveau_Education)}
          ${fld('Profession', client.Profession)}
          ${fld('Revenu mensuel', client.Revenu_Total ? (+client.Revenu_Total).toLocaleString('fr-FR')+' DT' : null, true)}
          ${fld('Type de logement', client.Type_Logement)}
          ${fld('Possède voiture', bool(client.Possede_Voiture))}
          ${fld('Possède immobilier', bool(client.Possede_Immobilier))}
        </div>
      </div>

      <!-- Crédit demandé -->
      <div class="fields-card">
        <div class="sec-title">Crédit demandé</div>
        <div class="fields-grid">
          ${fld('Montant crédit', client.Montant_Credit ? (+client.Montant_Credit).toLocaleString('fr-FR')+' DT' : null, true)}
          ${fld('Mensualité', client.Mensualite ? (+client.Mensualite).toLocaleString('fr-FR')+' DT' : null)}
          ${fld('Prix du bien', client.Prix_Bien ? (+client.Prix_Bien).toLocaleString('fr-FR')+' DT' : null)}
          ${fld('Région', client.Note_Region)}
        </div>
      </div>

      <!-- Motifs modèle -->
      ${motifs.length ? `
      <div class="motifs-card">
        <div class="motifs-title">⚠ Motifs de la décision modèle</div>
        ${motifs.map(m=>`<div class="motif-item"><div class="motif-dot"></div><span>${m}</span></div>`).join('')}
      </div>` : ''}

      <!-- Décision agent -->
      <div class="agent-card">
        <div class="agent-title">Décision de l'agent</div>
        <div class="agent-btns">
          <button class="btn-approve" id="btn_approve" onclick="chooseDecision('APPROUVE')">✓ Approuver</button>
          <button class="btn-reject"  id="btn_reject"  onclick="chooseDecision('REFUSE')">✗ Refuser</button>
        </div>
        <select class="motif-select" id="motif_select">
          <option value="">— Sélectionner un motif —</option>
          <option value="Capacité de remboursement suffisante">Capacité de remboursement suffisante</option>
          <option value="Profil de risque acceptable">Profil de risque acceptable</option>
          <option value="Score bureau satisfaisant">Score bureau satisfaisant</option>
          <option value="Taux d'endettement trop élevé">Taux d'endettement trop élevé</option>
          <option value="Revenus insuffisants">Revenus insuffisants</option>
          <option value="Historique de paiement défavorable">Historique de paiement défavorable</option>
          <option value="Dossier incomplet">Dossier incomplet</option>
          <option value="Surendettement">Surendettement</option>
          <option value="Autre">Autre</option>
        </select>
        <button class="btn-confirm show" id="btn_confirm" onclick="confirmerDecision()">Confirmer la décision</button>
        <div class="decision-done" id="decision_done"></div>
      </div>
    </div>

    <!-- Colonne droite : scoring -->
    <div>
      <div class="scoring-card">
        <div style="width:100%;font-family:'Syne';font-size:12px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.6px;">Score du modèle</div>
        <div class="gauge-wrap">
          <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">${ticks}</svg>
          <div class="gauge-center">
            <div class="gauge-num" style="color:${color}">${sc}</div>
            <div class="gauge-denom">/1000</div>
          </div>
        </div>
        <div class="score-meta">
          <div class="sm-item">
            <div class="sm-val" style="color:${nc}">${d.Notation||'—'}</div>
            <div class="sm-lbl">NOTATION</div>
          </div>
          <div class="sm-item">
            <div class="sm-val" style="color:${color}">${pd} %</div>
            <div class="sm-lbl">PROB. DÉFAUT</div>
          </div>
        </div>
        <div class="dec-band ${dc}" style="width:100%">
          <div class="dec-lbl">${dc.replace('_',' ')}</div>
        </div>
      </div>
    </div>
  </div>`;

  // état de la décision
  window._currentDossier = d;
  window._pendingDecision = null;
}

let _pendingDecision = null;

function chooseDecision(dec){
  _pendingDecision = dec;
  document.getElementById('btn_approve').disabled = false;
  document.getElementById('btn_reject').disabled  = false;
  if(dec==='APPROUVE'){
    document.getElementById('btn_approve').style.outline = '3px solid #1a7a4f';
    document.getElementById('btn_reject').style.outline  = 'none';
  } else {
    document.getElementById('btn_reject').style.outline  = '3px solid #b52f2f';
    document.getElementById('btn_approve').style.outline = 'none';
  }
  const sel = document.getElementById('motif_select');
  sel.className = 'motif-select show';
  sel.innerHTML = dec==='APPROUVE'
    ? `<option value="">— Motif d'acceptation —</option>
       <option>Capacité de remboursement suffisante</option>
       <option>Profil de risque acceptable</option>
       <option>Score bureau satisfaisant</option>
       <option>Garanties suffisantes</option>
       <option>Autre</option>`
    : `<option value="">— Motif de rejet —</option>
       <option>Taux d'endettement trop élevé</option>
       <option>Revenus insuffisants</option>
       <option>Historique de paiement défavorable</option>
       <option>Score bureau insuffisant</option>
       <option>Surendettement</option>
       <option>Dossier incomplet</option>
       <option>Autre</option>`;
  document.getElementById('btn_confirm').className = 'btn-confirm show';
}

async function confirmerDecision(){
  if(!_pendingDecision){ alert('Choisissez une décision (Approuver ou Refuser).'); return; }
  const motif = document.getElementById('motif_select').value;
  if(!motif){ alert('Veuillez sélectionner un motif.'); return; }
  const dossier = window._currentDossier;
  if(!dossier) return;

  const body = {
    decision_id:         dossier.Id,
    decision_agent:      _pendingDecision,
    decision_modele:     dossier.DecisionModele,
    motif_acceptation:   _pendingDecision==='APPROUVE' ? motif : null,
    motif_rejet:         _pendingDecision==='REFUSE'   ? motif : null,
  };

  try{
    document.getElementById('btn_confirm').disabled = true;
    document.getElementById('btn_confirm').textContent = 'Enregistrement…';
    const r = await apiFetch(`${BASE}/octroi/confirmer`, {
      method:'POST', headers:ah(), body: JSON.stringify(body)
    });
    const j = await r.json();
    if(j.success){
      const dd = document.getElementById('decision_done');
      dd.style.display='flex';
      dd.className = 'decision-done '+(_pendingDecision==='APPROUVE'?'ok':'bad');
      dd.textContent = _pendingDecision==='APPROUVE' ? '✓ Dossier approuvé avec succès' : '✗ Dossier refusé';
      document.getElementById('btn_approve').disabled = true;
      document.getElementById('btn_reject').disabled  = true;
      document.getElementById('btn_confirm').style.display='none';
      document.getElementById('motif_select').style.display='none';
      // Retirer le dossier de la liste
      allDossiers = allDossiers.filter(d=>d.Id!==dossier.Id);
      renderTable();
    } else {
      alert('Erreur : ' + (j.message||'inconnue'));
      document.getElementById('btn_confirm').disabled = false;
      document.getElementById('btn_confirm').textContent = 'Confirmer la décision';
    }
  }catch(e){
    console.error(e);
    document.getElementById('btn_confirm').disabled = false;
    document.getElementById('btn_confirm').textContent = 'Confirmer la décision';
  }
}

// Démarrage
loadDossiers();
</script>
</body>
</html>
